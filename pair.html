<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pair Code — X-GURU</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-dark: #0f0f23;
  --bg-blue: #0a1128;
  --accent-blue: #2563eb;
  --accent-light-blue: #3b82f6;
  --card-bg: rgba(16, 22, 36, 0.95);
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --border-color: rgba(59, 130, 246, 0.2);
  --success-green: #10b981;
  --btn-gradient: linear-gradient(135deg, #2563eb, #3b82f6);
}

/* Reset & Body */
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; font-family:'Inter', sans-serif; }
body {
  display:flex; justify-content:center; align-items:center;
  background: linear-gradient(135deg, var(--bg-dark), var(--bg-blue));
  overflow-x:hidden;
  position:relative;
  color: var(--text-primary);
  padding: 20px;
}

/* Background elements */
.bg-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.3;
}

.bg-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  z-index: -1;
}

/* Main Card */
.card {
  position: relative;
  width: 100%;
  max-width: 420px;
  padding: 30px;
  border-radius: 20px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 
              0 0 0 1px rgba(59, 130, 246, 0.1),
              inset 0 1px 0 rgba(255, 255, 255, 0.05);
  overflow: hidden;
  z-index: 1;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), transparent);
  z-index: 2;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(59, 130, 246, 0.1);
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
}

.logo-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--btn-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: white;
}

.logo-text {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(90deg, #f8fafc, #cbd5e1);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 5px;
}

.system-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(16, 185, 129, 0.1);
  color: var(--success-green);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  margin-top: 5px;
}

.system-status::before {
  content: "";
  width: 8px;
  height: 8px;
  background-color: var(--success-green);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}

/* Form */
.form-group {
  margin-bottom: 25px;
}

.form-label {
  display: block;
  margin-bottom: 10px;
  font-size: 15px;
  color: var(--text-secondary);
  font-weight: 500;
}

.example-text {
  font-size: 13px;
  color: rgba(203, 213, 225, 0.6);
  margin-top: 5px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.country-code {
  position: absolute;
  left: 15px;
  color: var(--text-secondary);
  font-weight: 500;
  z-index: 2;
}

.input-field {
  width: 100%;
  padding: 16px 16px 16px 70px;
  border-radius: 12px;
  border: 1px solid rgba(59, 130, 246, 0.2);
  background: rgba(15, 23, 42, 0.7);
  color: var(--text-primary);
  font-size: 16px;
  font-family: 'Roboto Mono', monospace;
  transition: all 0.3s;
}

.input-field:focus {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

/* Buttons */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 10px;
}

.btn-primary {
  background: var(--btn-gradient);
  color: white;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: rgba(30, 41, 59, 0.7);
  color: var(--text-secondary);
  border: 1px solid rgba(59, 130, 246, 0.2);
}

.btn-secondary:hover {
  background: rgba(30, 41, 59, 0.9);
  border-color: rgba(59, 130, 246, 0.4);
}

/* Code Display */
.code-section {
  margin-top: 30px;
  padding-top: 25px;
  border-top: 1px solid rgba(59, 130, 246, 0.1);
}

.section-title {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--text-primary);
}

.code-display {
  background: rgba(15, 23, 42, 0.7);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid rgba(59, 130, 246, 0.2);
  margin-bottom: 20px;
  text-align: center;
}

.code-value {
  font-family: 'Roboto Mono', monospace;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 3px;
  color: white;
  text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
  margin-bottom: 15px;
}

.session-active {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(37, 99, 235, 0.1);
  color: var(--accent-blue);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
}

.button-group {
  display: flex;
  gap: 12px;
  margin-top: 15px;
}

.btn-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex: 1;
  padding: 12px;
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid rgba(59, 130, 246, 0.1);
  font-size: 13px;
  color: rgba(203, 213, 225, 0.5);
}

/* Responsive */
@media (max-width: 480px) {
  .card {
    padding: 20px;
    border-radius: 16px;
  }
  
  .logo-text {
    font-size: 24px;
  }
  
  .code-value {
    font-size: 26px;
    letter-spacing: 2px;
  }
  
  .button-group {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<!-- Background elements -->
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<!-- Main Card -->
<div class="card">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-robot"></i>
      </div>
      <div class="logo-text">X-GURU</div>
    </div>
    <div class="subtitle">Pair Code</div>
    <div class="system-status">The system is ready</div>
  </div>

  <div class="form-group">
    <div class="form-label">Enter your number with country code</div>
    <div class="example-text">Example: 254 XXX XXX XXX</div>
    <div class="input-wrapper">
      <span class="country-code">+254</span>
      <input 
        type="text" 
        id="number" 
        class="input-field" 
        inputmode="numeric" 
        placeholder="762 02......" 
        value="762 02......"
      />
    </div>
  </div>

  <button id="submit" class="btn btn-primary">
    <i class="fas fa-link"></i> Get Code
  </button>

  <div id="pair" class="code-section" aria-live="polite">
    <div class="section-title">Your Pairing Code:</div>
    <div class="code-display">
      <div class="code-value">KZXFKAVO</div>
      <div class="session-active">
        <i class="fas fa-circle"></i> Pairing session is active now
      </div>
    </div>
    <div class="button-group">
      <button id="copyBtn" class="btn btn-secondary btn-icon">
        <i class="fas fa-copy"></i> Copy Code
      </button>
      <button id="backBtn" class="btn btn-secondary btn-icon">
        <i class="fas fa-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <div class="footer">
    © 2025 X-GURU — Secure WhatsApp Bot Connection
  </div>
</div>

<script>
const pairEl = document.getElementById('pair');
const submitBtn = document.getElementById('submit');
const copyBtn = document.getElementById('copyBtn');
const backBtn = document.getElementById('backBtn');
const numInput = document.getElementById('number');

// Initialize with the code from the image
const initialCode = 'KZXFKAVO';

// Copy code functionality
copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(initialCode);
  
  // Visual feedback
  const originalText = copyBtn.innerHTML;
  copyBtn.innerHTML = '<i class="fas fa-check"></i> Code Copied';
  copyBtn.style.background = 'linear-gradient(135deg, #10b981, #34d399)';
  
  setTimeout(() => {
    copyBtn.innerHTML = originalText;
    copyBtn.style.background = '';
  }, 1500);
});

// Back button functionality
backBtn.addEventListener('click', () => {
  numInput.value = '762 02......';
  numInput.focus();
});

// Get code functionality
submitBtn.addEventListener('click', async () => {
  const raw = (numInput.value || '').trim();
  const digits = raw.replace(/\D/g, '');
  
  if (!digits) { 
    alert('Please enter your WhatsApp number');
    return; 
  }
  
  if (digits.length < 8) { 
    alert('Number is too short. Please include the full phone number.'); 
    return; 
  }

  // Save original button state
  const originalText = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
  
  // Simulate API call with delay
  setTimeout(() => {
    // In a real implementation, this would be an API call
    // For demo, we'll just show a success message
    alert(`Code requested for +254${digits}. In a real implementation, this would connect to your backend.`);
    
    // Reset button
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalText;
  }, 1500);
});

// Allow Enter key to submit
numInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    submitBtn.click();
  }
});

// Focus on the number part when clicking the input
numInput.addEventListener('click', function() {
  if (this.value === '762 02......') {
    this.setSelectionRange(0, 0);
  }
});
</script>
</body>
</html>
