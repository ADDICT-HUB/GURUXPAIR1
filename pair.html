<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>X GURU | Pair Code</title>

<style>
* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 400px;
}

.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  border: 1px solid #e1e4e8;
}

/* Header */
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 24px 20px;
  text-align: center;
  position: relative;
}

.header h1 {
  color: white;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.header p {
  color: rgba(255, 255, 255, 0.9);
  font-size: 14px;
  font-weight: 400;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 10px solid #764ba2;
}

/* Content */
.content {
  padding: 32px 24px 24px;
}

.instruction {
  text-align: center;
  margin-bottom: 24px;
  line-height: 1.5;
  color: #333;
  font-size: 15px;
}

/* Input Section */
.input-section {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 24px;
  border: 1px solid #e9ecef;
}

.phone-input {
  display: flex;
  align-items: center;
  background: white;
  border: 1px solid #d1d5da;
  border-radius: 6px;
  padding: 12px 16px;
  margin-bottom: 12px;
  font-size: 16px;
}

.country-code {
  color: #555;
  font-weight: 500;
  margin-right: 8px;
  user-select: none;
}

.phone-number {
  color: #333;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.get-code-btn {
  width: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 14px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.get-code-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.get-code-btn:active {
  transform: translateY(0);
}

/* Code Display */
.code-section {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  border: 1px solid #e9ecef;
  margin-bottom: 20px;
}

.code-title {
  color: #555;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 12px;
  letter-spacing: 0.3px;
}

.code-display {
  background: white;
  border: 1px solid #d1d5da;
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 16px;
}

.code-value {
  font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #333;
}

.session-status {
  display: inline-flex;
  align-items: center;
  background: #e7f5e9;
  color: #2e7d32;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}

.session-status::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #4caf50;
  border-radius: 50%;
  margin-right: 6px;
}

/* Buttons */
.buttons {
  display: flex;
  gap: 12px;
}

.btn {
  flex: 1;
  padding: 12px;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid #d1d5da;
  background: white;
  color: #555;
}

.btn:hover {
  background: #f8f9fa;
  transform: translateY(-1px);
}

.btn.copy {
  border-color: #667eea;
  color: #667eea;
}

.btn.copy:hover {
  background: #f0f2ff;
}

.btn.back {
  border-color: #d1d5da;
  color: #555;
}

.btn.back:hover {
  background: #f8f9fa;
}

/* Footer */
.footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  padding: 16px;
  border-top: 1px solid #f0f2f5;
  background: #fafbfc;
}

/* Responsive */
@media (max-width: 420px) {
  .content {
    padding: 24px 16px 16px;
  }
  
  .buttons {
    flex-direction: column;
  }
  
  .code-value {
    font-size: 20px;
    letter-spacing: 1.5px;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <!-- Header -->
    <div class="header">
      <h1>X GURU | Pair Code</h1>
      <p>'HI: X Code</p>
    </div>
    
    <!-- Content -->
    <div class="content">
      <p class="instruction">
        The system is ready. Enter your number with country code (e.g., 254...) to get your code.
      </p>
      
      <!-- Phone Input -->
      <div class="input-section">
        <div class="phone-input">
          <span class="country-code">+254</span>
          <span class="phone-number">762 02......</span>
        </div>
        <button class="get-code-btn" id="getCodeBtn">
          Get Code
        </button>
      </div>
      
      <!-- Code Display (Initially hidden) -->
      <div class="code-section" id="codeSection" style="display: none;">
        <div class="code-title">Your Pairing Code:</div>
        <div class="code-display">
          <div class="code-value" id="codeValue">KZXFKAVO</div>
        </div>
        <div class="session-status">
          Pairing session is active now
        </div>
        
        <div class="buttons">
          <button class="btn copy" id="copyBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 4V16C8 17.1046 8.89543 18 10 18H18C19.1046 18 20 17.1046 20 16V7.24264C20 6.70404 19.7893 6.1883 19.4142 5.81321L16.6863 3.08529C16.3112 2.71021 15.7955 2.5 15.2569 2.5H10C8.89543 2.5 8 3.39543 8 4Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 8V19C4 20.1046 4.89543 21 6 21H14C15.1046 21 16 20.1046 16 19V8C16 6.89543 15.1046 6 14 6H6C4.89543 6 4 6.89543 4 8Z" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Copy Code
          </button>
          <button class="btn back" id="backBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 12H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
          </button>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      © 2025 X-GURU — Secure connection
    </div>
  </div>
</div>

<script>
// Get DOM elements
const getCodeBtn = document.getElementById('getCodeBtn');
const codeSection = document.getElementById('codeSection');
const codeValue = document.getElementById('codeValue');
const copyBtn = document.getElementById('copyBtn');
const backBtn = document.getElementById('backBtn');
const phoneNumber = document.querySelector('.phone-number');

// Predefined code from the image
const pairingCode = 'KZXFKAVO';

// Show code when "Get Code" is clicked
getCodeBtn.addEventListener('click', () => {
  // Get the phone number (in real app, this would be user input)
  const currentNumber = phoneNumber.textContent;
  
  // Basic validation
  if (currentNumber.includes('......')) {
    // In a real app, you'd show an input field
    // For this demo, we'll just use the placeholder
    alert('Please enter a valid phone number (replace "......" with your number)');
    return;
  }
  
  // Show code section with animation
  codeSection.style.display = 'block';
  
  // Scroll to code section smoothly
  codeSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  
  // In a real app, you would make an API call here:
  // fetch(`/api/get-code?phone=${encodeURIComponent(currentNumber)}`)
  //   .then(response => response.json())
  //   .then(data => {
  //     codeValue.textContent = data.code;
  //   });
});

// Copy code functionality
copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(pairingCode)
    .then(() => {
      // Show feedback
      const originalText = copyBtn.innerHTML;
      copyBtn.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6L9 17L4 12" stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Copied!
      `;
      copyBtn.style.color = '#4caf50';
      copyBtn.style.borderColor = '#4caf50';
      
      // Reset after 2 seconds
      setTimeout(() => {
        copyBtn.innerHTML = originalText;
        copyBtn.style.color = '';
        copyBtn.style.borderColor = '';
      }, 2000);
    })
    .catch(err => {
      console.error('Failed to copy: ', err);
      alert('Failed to copy code. Please try again.');
    });
});

// Back button functionality
backBtn.addEventListener('click', () => {
  // Hide code section
  codeSection.style.display = 'none';
  
  // Reset phone number placeholder
  phoneNumber.textContent = '762 02......';
  
  // Focus back on the input (in a real app)
  getCodeBtn.focus();
});

// Make phone number editable on click (for demo purposes)
phoneNumber.addEventListener('click', () => {
  const currentText = phoneNumber.textContent;
  if (currentText === '762 02......') {
    phoneNumber.textContent = '762 02';
    phoneNumber.style.caretColor = '#667eea';
    
    // In a real app, you'd replace this with an actual input field
    // For this demo, we'll just add a cursor effect
    phoneNumber.style.borderBottom = '2px solid #667eea';
    phoneNumber.style.paddingBottom = '2px';
    phoneNumber.style.display = 'inline-block';
    phoneNumber.style.minWidth = '100px';
    
    // Focus effect
    setTimeout(() => {
      // Move cursor to end (simulated)
      phoneNumber.focus();
    }, 10);
  }
});

// Allow Enter key to trigger Get Code
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && codeSection.style.display === 'none') {
    getCodeBtn.click();
  }
});
</script>
</body>
</html>
