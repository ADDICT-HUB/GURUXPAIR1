<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pair Code — X-GURU</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg-deep: #001028;
      --glass-deep: rgba(4,18,40,0.72);
      --accent-blue: #00a8ff;
      --accent-teal: #00ffc6;
      --gold: #ffd166;
      --muted: rgba(255,255,255,0.08);
      --glass-border: rgba(255,215,0,0.25);
      --card-radius: 22px;
      --glass-blur: 18px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 10% 10%, rgba(2,30,60,0.65), transparent 20%),
                  radial-gradient(circle at 90% 90%, rgba(0,16,40,0.6), transparent 20%),
                  var(--bg-deep);
      color: #eaf6f5;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      position:relative;
    }

    /* --------------- Animated Real Smoke (CSS) --------------- */
    /* Using multiple blurred gradient layers that drift slowly to emulate 'real' smoke */
    .smoke-layer{
      position:fixed;
      inset:0;
      z-index:-3;
      pointer-events:none;
      overflow:hidden;
      mix-blend-mode: screen;
      opacity:0.45;
    }

    .smoke {
      position:absolute;
      width:160vmax;
      height:80vmax;
      left: -30vmax;
      top: -10vmax;
      background:
        radial-gradient(45% 35% at 20% 30%, rgba(0,160,255,0.06) 0%, transparent 20%),
        radial-gradient(40% 30% at 60% 10%, rgba(0,255,198,0.04) 0%, transparent 18%),
        radial-gradient(30% 25% at 80% 70%, rgba(0,110,255,0.035) 0%, transparent 16%),
        radial-gradient(20% 18% at 40% 60%, rgba(255,210,120,0.02) 0%, transparent 12%);
      filter: blur(40px) saturate(140%);
      animation: drift 28s linear infinite;
      transform-origin:center;
    }

    .smoke.slow { animation-duration: 44s; opacity:0.3; transform: rotate(6deg) }
    .smoke.fast { animation-duration: 18s; opacity:0.55; transform: rotate(-6deg) }

    @keyframes drift {
      0%   { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
      25%  { transform: translate3d(8vmax,2vmax,0) rotate(2deg) scale(1.02); }
      50%  { transform: translate3d(16vmax, -1vmax,0) rotate(-1deg) scale(1.04); }
      75%  { transform: translate3d(6vmax,-3vmax,0) rotate(1deg) scale(1.01); }
      100% { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
    }

    /* subtle second set */
    .smoke-2{
      position:absolute;
      width:200vmax;
      height:90vmax;
      left:-40vmax;
      top:-30vmax;
      background:
        radial-gradient(40% 30% at 15% 20%, rgba(0,105,200,0.06) 0%, transparent 22%),
        radial-gradient(35% 25% at 70% 30%, rgba(0,210,180,0.03) 0%, transparent 20%);
      filter: blur(60px) saturate(130%);
      animation: drift2 36s linear infinite;
      opacity:0.28;
      mix-blend-mode: screen;
    }

    @keyframes drift2 {
      0%   { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
      50%  { transform: translate3d(24vmax, -6vmax,0) rotate(-2deg) scale(1.06); }
      100% { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
    }

    /* subtle particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,0.02) 0 1px, transparent 1px),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.01) 0 1px, transparent 1px);
      opacity:0.5;
      mix-blend-mode: screen;
    }

    /* --------------- Container Card (Godly Glass Blue+Gold) --------------- */
    .wrap {
      width:100%;
      max-width:460px;
      margin:auto;
      padding: 28px;
    }

    .card {
      position: relative;
      border-radius: var(--card-radius);
      padding: 28px;
      background: linear-gradient(180deg, rgba(6,20,38,0.62), rgba(6,20,38,0.45) 50%, rgba(2,40,80,0.28));
      border: 1.5px solid rgba(255,215,0,0.08); /* subtle gold edge */
      box-shadow:
        0 20px 50px rgba(0,8,30,0.7),
        0 6px 30px rgba(0,110,255,0.12),
        inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      overflow: hidden;
      z-index: 1;
      transition: transform .35s cubic-bezier(.2,.9,.3,1);
    }

    .card:hover { transform: translateY(-8px) scale(1.01) }

    /* Luxury rim & neon glow */
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:2px;
      background: linear-gradient(120deg, rgba(0,124,255,0.14), rgba(255,215,0,0.09), rgba(0,190,220,0.12));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      filter: blur(8px);
      opacity:0.95;
    }

    /* top gleam */
    .card::after{
      content:"";
      position:absolute;
      top:-30%;
      left:-10%;
      width:140%;
      height:70%;
      background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(0,0,0,0));
      transform: rotate(-18deg);
      filter: blur(12px) saturate(140%);
      pointer-events:none;
      opacity:0.6;
    }

    /* header */
    .brand {
      text-align:center;
      margin-bottom:10px;
    }
    .brand h1{
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      letter-spacing:2px;
      color: transparent;
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-blue));
      -webkit-background-clip:text;
      margin-bottom:6px;
    }
    .brand p{ color: rgba(255,255,255,0.65); font-size:0.92rem; margin-bottom:6px }

    /* box styling (inner) */
    .inner {
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:stretch;
    }

    .input-row{
      display:flex;
      gap:10px;
      align-items:center;
      width:100%;
    }

    .input {
      flex:1;
      min-width:0;
      border-radius:12px;
      padding:12px 14px;
      font-size:1rem;
      border: none;
      outline: none;
      color:#001;
      background: linear-gradient(90deg, rgba(255,255,255,0.94), rgba(240,240,240,0.95));
      box-shadow: inset 2px 2px 8px rgba(0,0,0,0.12), inset -2px -2px 6px rgba(255,255,255,0.7);
      transition: box-shadow .18s ease, transform .18s ease;
    }

    .input:focus { box-shadow: 0 0 24px rgba(0,160,255,0.12), inset 2px 2px 6px rgba(0,0,0,0.12) }

    .submit {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-width:110px;
      padding:12px 14px;
      border-radius:12px;
      background: linear-gradient(135deg, rgba(0,130,255,0.95), rgba(0,200,220,0.92));
      color:white;
      font-weight:700;
      border:none;
      cursor:pointer;
      box-shadow: 0 8px 20px rgba(0,130,255,0.22), 0 2px 6px rgba(0,0,0,0.35);
      transition: transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .16s;
    }
    .submit:active{ transform: translateY(1px) }
    .submit:hover{ box-shadow: 0 12px 30px rgba(0,130,255,0.28) }

    /* processing area */
    #pair {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-top:6px;
      min-height:68px;
    }

    .code-display {
      position:relative;
      background: linear-gradient(180deg, rgba(8,12,18,0.9), rgba(20,24,30,0.92));
      padding:14px 18px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow: 0 10px 30px rgba(0,6,20,0.6), 0 0 16px rgba(0,120,255,0.06);
      cursor:pointer;
      display:inline-flex;
      gap:12px;
      align-items:center;
      min-width:220px;
      max-width:100%;
    }

    .code-text { font-size:1rem; color: rgba(255,255,255,0.9); font-weight:700; }
    .code-value { font-family: monospace; color:var(--accent-blue); font-weight:900; text-shadow: 0 0 12px rgba(0,160,255,0.12); letter-spacing:1px }

    /* Floating circular hologram COPY button (style B) */
    .copy-fab {
      position: absolute;
      right: -20px;
      top: -20px;
      width:56px;
      height:56px;
      border-radius:50%;
      display:inline-grid;
      place-items:center;
      background: radial-gradient(circle at 30% 30%, rgba(0,255,200,0.18), rgba(0,120,255,0.14)),
                  linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(0,255,200,0.16);
      box-shadow:
        0 6px 18px rgba(0,120,255,0.22),
        0 0 28px rgba(0,200,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(6px) saturate(140%);
      cursor:pointer;
      transform: translateY(0);
      transition: transform .16s, box-shadow .16s;
      z-index: 30;
    }

    .copy-fab:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,120,255,0.32) }

    /* hologram ripple */
    .copy-fab::after{
      content:'';
      position:absolute;
      inset:0;
      border-radius:inherit;
      background: radial-gradient(circle at 50% 50%, rgba(0,255,200,0.06), transparent 40%);
      filter: blur(6px);
      animation: holoPulse 2.8s infinite;
      pointer-events:none;
      opacity:0.95;
    }
    @keyframes holoPulse {
      0%{ transform: scale(0.9); opacity:0.7 }
      50%{ transform: scale(1.25); opacity:0.35 }
      100%{ transform: scale(0.9); opacity:0.7 }
    }

    .copy-icon { color: #e9fbff; font-size:18px; text-shadow: 0 2px 8px rgba(0,120,255,0.2) }

    /* small tooltip */
    .copy-tooltip {
      position:absolute;
      bottom: calc(100% + 8px);
      right: 0;
      transform: translateX(-6px);
      background: rgba(2,8,20,0.9);
      color:#dff8f6;
      padding:6px 8px;
      border-radius:8px;
      font-size:0.78rem;
      border: 1px solid rgba(0,160,255,0.06);
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      opacity:0;
      pointer-events:none;
      transition: opacity .16s, transform .16s;
    }
    .copy-tooltip.show { opacity:1; transform: translateX(0) translateY(-2px) }

    /* processing / error messages */
    .msg { font-size:0.93rem; color: rgba(255,255,255,0.9) }
    .err { color:#ff8d8d; font-weight:700 }

    /* footer */
    .foot {
      margin-top:14px;
      text-align:center;
      color: rgba(255,255,255,0.45);
      font-size:0.82rem;
    }

    /* responsive */
    @media (max-width:520px){
      .wrap{ padding:0 8px }
      .card{ padding:18px; border-radius:16px }
      .copy-fab{ right:-14px; top:-14px; width:48px; height:48px }
      .brand h1{ font-size:20px }
    }
  </style>
</head>
<body>

  <!-- Smoke & particles -->
  <div class="smoke-layer" aria-hidden="true">
    <div class="smoke slow"></div>
    <div class="smoke fast" style="top:20vh; left:-10vmax; opacity:0.45"></div>
    <div class="smoke-2"></div>
  </div>
  <div class="particles" aria-hidden="true"></div>

  <div class="wrap" role="main">
    <div class="card" aria-labelledby="brand-title">
      <div class="brand" id="brand-title">
        <h1>X-GURU SESSION</h1>
        <p>JUNE X — Pair your WhatsApp bot safely</p>
      </div>

      <div class="inner">
        <div style="display:flex; gap:12px; align-items:center; justify-content:center; flex-direction:column;">
          <p class="msg" style="text-align:center; max-width:380px">Enter your phone number with country code (example: <strong>254792021944</strong>), then tap <strong>Submit</strong>.</p>
        </div>

        <div class="input-row" style="margin-top:6px">
          <input id="number" class="input" inputmode="numeric" pattern="[0-9]*" placeholder="254792021944" aria-label="Phone number with country code" />
          <button id="submit" class="submit" aria-label="Submit number"><i class="fa fa-link" style="opacity:0.95"></i> <span style="margin-left:6px">Submit</span></button>
        </div>

        <div id="pair" aria-live="polite"></div>

        <div class="foot">© 2025 JUNE-X BOT — Secure connection</div>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const pairEl = document.getElementById('pair');
    const submitBtn = document.getElementById('submit');
    const numInput = document.getElementById('number');

    // Helper: show a temporary message in pairEl
    function showMessage(html, isError=false){
      pairEl.innerHTML = '<div class="code-display"><div style="display:flex;flex-direction:column; gap:6px; align-items:center">' +
                          '<div class="msg '+(isError? 'err':'')+'">' + html + '</div></div></div>';
    }

    // Format number to show with plus and spaces similar to your previous behaviour
    function prettyFormat(num){
      const digits = num.replace(/\\D/g,'');
      // naive spacing: +XXX XXX XXXX... (keep simple)
      if(digits.length <= 3) return '+' + digits;
      if(digits.length <= 7) return '+' + digits.slice(0,3) + ' ' + digits.slice(3);
      return '+' + digits.slice(0,3) + ' ' + digits.slice(3,7) + ' ' + digits.slice(7);
    }

    // create code display DOM with copy FAB
    function renderCode(code){
      // main container
      const container = document.createElement('div');
      container.className = 'code-display';
      container.setAttribute('role','button');
      container.setAttribute('tabindex','0');
      container.setAttribute('aria-label','Pair code display, click to copy');

      // left text
      const left = document.createElement('div');
      left.style.display = 'flex';
      left.style.flexDirection = 'column';
      left.style.gap = '4px';
      left.innerHTML = '<div class="code-text">CODE</div><div class="code-value" id="code-val">'+ code +'</div>';

      container.appendChild(left);

      // floating copy FAB (hologram)
      const fab = document.createElement('button');
      fab.className = 'copy-fab';
      fab.type = 'button';
      fab.setAttribute('aria-label','Copy code');
      fab.innerHTML = '<i class="fa fa-copy copy-icon" aria-hidden="true"></i>';

      // tooltip
      const tip = document.createElement('div');
      tip.className = 'copy-tooltip';
      tip.innerText = 'Copy';
      fab.appendChild(tip);

      // position the fab relative to container
      container.style.position = 'relative';
      container.appendChild(fab);

      // clicking container also copies
      container.addEventListener('click', async (e) => {
        // avoid double triggering when clicking the fab (fab handles)
        if(e.target.closest('.copy-fab')) return;
        await copyToClipboard(code, tip);
      });

      // fab click copies (with micro-animation)
      fab.addEventListener('click', async (e) => {
        e.stopPropagation();
        await copyToClipboard(code, tip);
        // small pop animation
        fab.animate([
          { transform: 'translateY(0) scale(1)' },
          { transform: 'translateY(-6px) scale(1.08)' },
          { transform: 'translateY(0) scale(1)' }
        ], { duration: 320, easing:'cubic-bezier(.2,.8,.2,1)'});
      });

      return container;
    }

    // Copy utility
    async function copyToClipboard(text, tipEl){
      try {
        await navigator.clipboard.writeText(text);
        tipEl.innerText = 'Copied';
        tipEl.classList.add('show');
        setTimeout(()=> {
          tipEl.classList.remove('show');
          tipEl.innerText = 'Copy';
        }, 1400);
      } catch (err){
        // fallback: select invisible textarea
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position='fixed';
        ta.style.left='-9999px';
        document.body.appendChild(ta);
        ta.select();
        try{
          document.execCommand('copy');
          tipEl.innerText='Copied';
          tipEl.classList.add('show');
          setTimeout(()=>{ tipEl.classList.remove('show'); tipEl.innerText='Copy' }, 1400);
        }catch(e){
          tipEl.innerText='Copy failed';
          tipEl.classList.add('show');
          setTimeout(()=>{ tipEl.classList.remove('show'); tipEl.innerText='Copy' }, 1600);
        } finally {
          document.body.removeChild(ta);
        }
      }
    }

    // Main submit handler
    submitBtn.addEventListener('click', async (ev) => {
      ev.preventDefault();

      const raw = (numInput.value || '').trim();
      const digits = raw.replace(/\\D/g,'');

      if(!digits){
        showMessage('Enter your WhatsApp number with Country Code (e.g. 2547...)', true);
        return;
      }
      if(digits.length < 8){
        showMessage('Invalid number — too short', true);
        return;
      }

      // show processing
      numInput.value = prettyFormat(digits);
      numInput.disabled = true;
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.8';
      showMessage('Processing…');

      try {
        // Replace with axios or fetch call — here using fetch
        // endpoint: /code?number=<digits>
        const resp = await fetch(`/code?number=${encodeURIComponent(digits)}`, { method:'GET' });
        if(!resp.ok){
          throw new Error('Network response not ok');
        }
        const data = await resp.json ? await resp.json() : await resp.text();
        // handle different shapes of response gracefully
        let code = '';
        if(typeof data === 'object' && data !== null){
          code = data.code ?? data.data ?? '';
        } else if(typeof data === 'string'){
          // if server returns plain string
          try {
            const j = JSON.parse(data);
            code = j.code ?? '';
          } catch(e){
            code = data;
          }
        }
        if(!code){
          // fallback message
          showMessage('Error: Service returned no code', true);
        } else {
          // render nice display with copy FAB
          pairEl.innerHTML = '';
          const node = renderCode(code);
          pairEl.appendChild(node);
        }
      } catch (err){
        console.error(err);
        showMessage('Error: Service Unavailable', true);
      } finally {
        numInput.disabled = false;
        submitBtn.disabled = false;
        submitBtn.style.opacity = '';
      }
    });

    // allow Enter key to submit
    numInput.addEventListener('keydown', (e)=> {
      if(e.key === 'Enter') { submitBtn.click(); }
    });

    // accessibility: focus styles for keyboard users
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Tab') document.body.classList.add('user-tabbing');
    });
  </script>
</body>
</html>
