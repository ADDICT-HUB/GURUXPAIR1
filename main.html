<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>X-GURU SESSION</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #000;
      font-family: 'Exo 2', sans-serif;
      color: #e5f5f1;
      overflow-x: hidden;
      position: relative;
    }

    /* 🌫️ Animated Smoke Background */
    .smoke-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -3;
    }

    .smoke {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0,120,255,0.15) 0%, rgba(0,0,0,0.8) 80%);
      animation: drift 25s infinite linear;
      filter: blur(120px);
      opacity: 0.9;
    }

    .smoke:nth-child(2) {
      animation-duration: 35s;
      animation-direction: reverse;
      opacity: 0.7;
    }

    .smoke:nth-child(3) {
      animation-duration: 45s;
      opacity: 0.5;
    }

    @keyframes drift {
      0% { transform: translate(-20%, -20%) scale(1); }
      50% { transform: translate(20%, 20%) scale(1.3); }
      100% { transform: translate(-20%, -20%) scale(1); }
    }

    /* Grid Overlay */
    .grid-overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0,255,170,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,170,0.05) 1px, transparent 1px);
      background-size: 55px 55px;
      z-index: -1;
      opacity: 0.35;
    }

    /* ✨ Premium Blue + Gold Glass Container */
    .container {
      width: 90%;
      max-width: 780px;
      padding: 2.2rem;
      border-radius: 25px;
      position: relative;
      z-index: 2;

      background: linear-gradient(
        135deg,
        rgba(10, 25, 47, 0.85),
        rgba(0, 78, 255, 0.25),
        rgba(255, 215, 0, 0.12)
      );
      box-shadow:
        0 0 30px rgba(0, 115, 255, 0.45),
        0 0 50px rgba(255, 215, 0, 0.3),
        inset 0 0 30px rgba(0, 200, 255, 0.25);
      backdrop-filter: blur(15px) saturate(180%);
      border: 2px solid rgba(255, 215, 0, 0.4);
    }

    /* Gold Shine Strip */
    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 6px;
      width: 100%;
      background: linear-gradient(
        90deg,
        gold,
        #008cff,
        gold
      );
      background-size: 300% 100%;
      animation: shine 3s infinite linear;
    }

    @keyframes shine {
      0% { background-position: 0% 0; }
      100% { background-position: 300% 0; }
    }

    /* Titles */
    .title {
      font-family: 'Orbitron';
      font-size: 2.6rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(90deg, #00ffaa, #0088ff);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 1.3rem;
    }

    .subtitle {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 300;
      margin-bottom: 2.4rem;
    }

    /* Buttons */
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 1.3rem;
      flex-wrap: wrap;
    }

    .btn {
      width: 220px;
      padding: 1.2em 2em;
      border-radius: 12px;
      background: rgba(0,255,170,0.1);
      border: 1px solid rgba(0,255,170,0.3);
      color: #e5f5f1;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 600;
      transition: 0.4s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,255,170,0.2);
    }

    .btn:hover {
      transform: translateY(-6px);
      background: rgba(0,255,170,0.2);
      box-shadow: 0 12px 25px rgba(0,255,170,0.45);
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,255,170,0.5); }
      70% { box-shadow: 0 0 0 15px rgba(0,255,170,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,255,170,0); }
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .btn { width: 100%; max-width: 300px; }
      .title { font-size: 2.1rem; }
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>

  <!-- Smoke Background -->
  <div class="smoke-bg">
    <div class="smoke"></div>
    <div class="smoke"></div>
    <div class="smoke"></div>
  </div>

  <div class="grid-overlay"></div>

  <!-- Main Card -->
  <div class="container">
    <h1 class="title">X-GURU SESSION</h1>
    <p class="subtitle">Choose your preferred option below.</p>

    <div class="buttons-container">
      <button onclick="window.open('/pair')" class="btn pulse"><i class="fas fa-link"></i> PAIR CODE</button>
      <button onclick="window.open('/qr')" class="btn"><i class="fas fa-qrcode"></i> QR SCAN</button>
      <button onclick="window.open('https://github.com/vinpink2/JUNE-X/fork')" class="btn"><i class="fab fa-github"></i> REPO FORK</button>
    </div>

    <div class="footer">X-GURU © 2025 | Secure connection</div>
  </div>

</body>
</html>
