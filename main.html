<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>X-GURU SESSION</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #000;
      font-family: 'Exo 2', sans-serif;
      color: #e5f5f1;
      overflow-x: hidden;
      position: relative;
    }

    /* 🌫️ Animated Smoke Background */
    .smoke-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -3;
    }

    .smoke {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0,120,255,0.15) 0%, rgba(0,0,0,0.8) 80%);
      animation: drift 25s infinite linear;
      filter: blur(120px);
      opacity: 0.9;
    }

    .smoke:nth-child(2) {
      animation-duration: 35s;
      animation-direction: reverse;
      opacity: 0.7;
    }

    .smoke:nth-child(3) {
      animation-duration: 45s;
      opacity: 0.5;
    }

    @keyframes drift {
      0% { transform: translate(-20%, -20%) scale(1); }
      50% { transform: translate(20%, 20%) scale(1.3); }
      100% { transform: translate(-20%, -20%) scale(1); }
    }

    /* Grid Overlay */
    .grid-overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0,255,170,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,170,0.05) 1px, transparent 1px);
      background-size: 55px 55px;
      z-index: -1;
      opacity: 0.35;
    }

    /* ✨ Ultra Premium Gold + Deep Blue Mirror-Glass Card */
.container {
  width: 90%;
  max-width: 780px;
  padding: 2.5rem;
  border-radius: 28px;
  position: relative;
  z-index: 2;

  /* Multi-layer glowing glass gradient */
  background: linear-gradient(
      135deg,
      rgba(255, 215, 0, 0.25) 0%,
      rgba(0, 80, 255, 0.35) 35%,
      rgba(0, 0, 30, 0.85) 60%,
      rgba(0, 120, 255, 0.38) 85%,
      rgba(255, 215, 0, 0.32) 100%
  );

  /* Mirror glass feeling */
  backdrop-filter: blur(18px) saturate(260%);
  -webkit-backdrop-filter: blur(18px) saturate(260%);

  /* High-end gold glow */
  border: 2.3px solid rgba(255, 215, 0, 0.75);

  /* Multi layered shadow + neon bloom */
  box-shadow:
    0 0 35px rgba(255, 215, 0, 0.55),
    0 0 55px rgba(0, 120, 255, 0.45),
    0 0 85px rgba(255, 215, 0, 0.45),
    inset 0 0 35px rgba(0, 150, 255, 0.35),
    inset 0 0 55px rgba(255, 215, 0, 0.32);
}

/* ⭐ Animated gold shine line */
.container::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 0;
  height: 7px;
  width: 100%;
  background: linear-gradient(
    90deg,
    rgba(255, 215, 0, 1),
    rgba(0, 170, 255, 1),
    rgba(255, 215, 0, 1)
  );
  background-size: 300% 100%;
  animation: goldshine 2.6s infinite linear;
  border-radius: 20px;
}

@keyframes goldshine {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}

/* ✨ Moving hologram reflection */
.container::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 28px;
  background: linear-gradient(
    60deg,
    transparent 0%,
    rgba(255,255,255,0.15) 20%,
    transparent 40%
  );
  opacity: 0.35;
  animation: reflect 5s infinite linear;
  pointer-events: none;
}

@keyframes reflect {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(120%); }
}

    .footer {
      text-align: center;
      margin-top: 2rem;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .btn { width: 100%; max-width: 300px; }
      .title { font-size: 2.1rem; }
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>

  <!-- Smoke Background -->
  <div class="smoke-bg">
    <div class="smoke"></div>
    <div class="smoke"></div>
    <div class="smoke"></div>
  </div>

  <div class="grid-overlay"></div>

  <!-- Main Card -->
  <div class="container">
    <h1 class="title">X-GURU SESSION</h1>
    <p class="subtitle">Choose your preferred option below.</p>

    <div class="buttons-container">
      <button onclick="window.open('/pair')" class="btn pulse"><i class="fas fa-link"></i> PAIR CODE</button>
      <button onclick="window.open('/qr')" class="btn"><i class="fas fa-qrcode"></i> QR SCAN</button>
      <button onclick="window.open('https://github.com/vinpink2/JUNE-X/fork')" class="btn"><i class="fab fa-github"></i> REPO FORK</button>
    </div>

    <div class="footer">X-GURU © 2025 | Secure connection</div>
  </div>

</body>
</html>
