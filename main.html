<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>X-GURU SESSION</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(145deg, #000000, #2b1e15);
      font-family: 'Exo 2', sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Modern animated wave background */
    .background-wave {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.02) 0%, transparent 70%);
      animation: wave 25s infinite linear;
      filter: blur(100px);
    }
    .background-wave:nth-child(2) {
      animation-duration: 40s;
      opacity: 0.6;
      filter: blur(150px);
    }
    .background-wave:nth-child(3) {
      animation-duration: 60s;
      opacity: 0.4;
      filter: blur(200px);
    }
    @keyframes wave {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      50% { transform: translate(50%, 50%) rotate(180deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Floating Glass Card */
    .card {
      position: relative;
      width: 90%;
      max-width: 720px;
      padding: 3rem 2rem;
      border-radius: 25px;
      background: rgba(255,255,255,0.05); /* semi-transparent glass */
      backdrop-filter: blur(25px) saturate(200%);
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow:
        0 15px 50px rgba(0,0,0,0.7),
        0 0 20px rgba(255,255,255,0.05) inset;
      overflow: hidden;
      z-index: 1;
    }

    /* Gold Mirror Shine Overlay */
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, rgba(255,255,255,0.15), rgba(255,215,0,0.2), rgba(255,255,255,0.1));
      transform: rotate(25deg);
      pointer-events: none;
      animation: shineMove 5s infinite linear;
    }
    @keyframes shineMove {
      0% { transform: translateX(-100%) rotate(25deg); }
      100% { transform: translateX(100%) rotate(25deg); }
    }

    /* Titles */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(90deg, #ffffff, #d4af37);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 1.5rem;
    }

    .subtitle {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: 3rem;
      color: #e0dcd5;
    }

    /* Buttons */
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1.2em 2em;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: 0.4s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.05);
    }

    .btn:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.1);
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05), rgba(255,255,255,0.2));
      transform: skewX(-25deg);
      transition: all 0.5s;
    }
    .btn:hover::after {
      left: 125%;
    }

    .footer {
      text-align: center;
      margin-top: 3rem;
      opacity: 0.7;
      color: #d4af37;
    }

    @media (max-width: 768px) {
      .title { font-size: 2.2rem; }
      .btn { width: 100%; max-width: 280px; }
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Animated Waves -->
  <div class="background-wave"></div>
  <div class="background-wave"></div>
  <div class="background-wave"></div>

  <!-- Main Glass Card -->
  <div class="card">
    <h1 class="title">X-GURU SESSION</h1>
    <p class="subtitle">Choose your preferred option below</p>

    <div class="buttons-container">
      <button onclick="window.open('/pair')" class="btn"><i class="fas fa-link"></i> PAIR CODE</button>
      <button onclick="window.open('/qr')" class="btn"><i class="fas fa-qrcode"></i> QR SCAN</button>
      <button onclick="window.open('https://github.com/ADDICT-HUB/XGURU/fork')" class="btn"><i class="fab fa-github"></i> REPO FORK</button>
    </div>

    <div class="footer">X-GURU © 2025 | Secure connection</div>
  </div>

</body>
</html>
